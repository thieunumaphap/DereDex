
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MangaDex Mobile</title>
  <!-- Nhúng thư viện Axios chuẩn hỗ trợ Safari iOS 15 -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; margin: 0; padding: 12px; }
    
    .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #1c1c1e; color: #fff; font-size: 16px; }
    button { padding: 12px 16px; border: none; background: #ff6b00; color: #fff; font-weight: bold; border-radius: 8px; font-size: 15px; }
    
    .manga-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .manga-card { background: #1c1c1e; border-radius: 8px; overflow: hidden; text-align: center; }
    .manga-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .manga-card h3 { font-size: 13px; margin: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .chap-btn { display: block; width: 100%; padding: 14px; margin-bottom: 8px; background: #1c1c1e; color: #fff; border: 1px solid #2c2c2e; border-radius: 8px; text-align: left; font-size: 15px; }
    .nav-btn { width: 100%; padding: 12px; margin: 10px 0; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 15px; }
    
    #reader img { display: block; width: 100%; height: auto; margin-bottom: 4px; }
    .status { text-align: center; padding: 20px; color: #aaa; font-size: 14px; }
    .error { color: #ff453a; text-align: center; padding: 15px; }
  </style>
</head>
<body>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Nhập tên truyện (VD: Naruto)..." />
    <button onclick="searchManga()">Tìm</button>
  </div>

  <div id="mainContent">
    <div class="status">Nhập tên truyện ở trên để bắt đầu tìm kiếm.</div>
  </div>

  <script>
    const baseUrl = 'https://api.mangadex.org';
    const coverUrl = 'https://uploads.mangadex.org/covers';
    const mainContent = document.getElementById('mainContent');

    // 1. TÌM KIẾM TRUYỆN DÙNG AXIOS
    async function searchManga() {
      const title = document.getElementById('searchInput').value.trim();
      if (!title) return;

      mainContent.innerHTML = '<div class="status">Đang tìm kiếm dữ liệu...</div>';

      try {
        const response = await axios({
          method: 'GET',
          url: `${baseUrl}/manga`,
          params: {
            title: title,
            'includes[]': 'cover_art',
            limit: 10,
            'contentRating[]': ['safe', 'suggestive']
          }
        });

        const mangaList = response.data.data;

        if (!mangaList || mangaList.length === 0) {
          mainContent.innerHTML = '<div class="status">Không tìm thấy truyện nào.</div>';
          return;
        }

        let html = '<div class="manga-grid">';
        mangaList.forEach(manga => {
          const mangaId = manga.id;
          const mangaTitle = manga.attributes.title.en || Object.values(manga.attributes.title)[0] || 'Chưa rõ tên';
          
          // Lấy thông tin bìa
          const coverRel = manga.relationships.find(rel => rel.type === 'cover_art');
          const fileName = coverRel && coverRel.attributes ? coverRel.attributes.fileName : null;
          const imageSrc = fileName 
            ? `${coverUrl}/${mangaId}/${fileName}.256.jpg` 
            : 'https://via.placeholder.com/160x200?text=No+Cover';

          html += `
            <div class="manga-card" onclick="loadChapters('${mangaId}', '${escapeQuote(mangaTitle)}')">
              <img src="${imageSrc}" alt="${mangaTitle}" />
              <h3>${mangaTitle}</h3>
            </div>
          `;
        });
        html += '</div>';
        mainContent.innerHTML = html;

      } catch (err) {
        console.error(err);
        mainContent.innerHTML = `<div class="error">Lỗi kết nối: ${err.message}. Vui lòng thử lại.</div>`;
      }
    }

    // 2. LẤY DANH SÁCH CHƯƠNG (Ưu tiên Tiếng Việt, hỗ trợ Tiếng Anh)
    async function loadChapters(mangaId, mangaTitle) {
      mainContent.innerHTML = '<div class="status">Đang tải danh sách chương...</div>';

      try {
        const response = await axios({
          method: 'GET',
          url: `${baseUrl}/manga/${mangaId}/feed`,
          params: {
            'translatedLanguage[]': ['vi', 'en'],
            'order[chapter]': 'asc',
            limit: 50
          }
        });

        const chapters = response.data.data;
        let html = `<h3>${mangaTitle}</h3>`;
        html += `<button class="nav-btn" onclick="searchManga()">← Quay lại danh sách</button>`;

        if (!chapters || chapters.length === 0) {
          html += '<div class="status">Không tìm thấy chương Tiếng Việt hoặc Tiếng Anh nào cho truyện này.</div>';
        } else {
          chapters.forEach(chap => {
            const num = chap.attributes.chapter ? `Chương ${chap.attributes.chapter}` : 'Oneshot';
            const lang = chap.attributes.translatedLanguage === 'vi' ? '🇻🇳 VN' : '🇬🇧 EN';
            const title = chap.attributes.title ? `: ${chap.attributes.title}` : '';
            
            html += `
              <button class="chap-btn" onclick="readChapter('${chap.id}')">
                [${lang}] ${num}${title}
              </button>
            `;
          });
        }

        mainContent.innerHTML = html;

      } catch (err) {
        console.error(err);
        mainContent.innerHTML = `<div class="error">Không thể tải danh sách chương: ${err.message}</div>`;
      }
    }

    // 3. ĐỌC CHƯƠNG (Tải ảnh từ server MangaDex@Home)
    async function readChapter(chapterId) {
      mainContent.innerHTML = '<div class="status">Đang tải trang truyện...</div>';

      try {
        const response = await axios({
          method: 'GET',
          url: `${baseUrl}/at-home/server/${chapterId}`
        });

        const serverData = response.data;
        const host = serverData.baseUrl;
        const hash = serverData.chapter.hash;
        const pageFiles = serverData.chapter.data;

        let html = `<button class="nav-btn" onclick="history.back()">← Chọn chương khác</button><div id="reader">`;
        
        pageFiles.forEach(file => {
          // Xây dựng đường dẫn ảnh gốc
          const imgPath = `${host}/data/${hash}/${file}`;
          html += `<img src="${imgPath}" loading="lazy" alt="Page" />`;
        });

        html += `</div>`;
        mainContent.innerHTML = html;
        window.scrollTo(0, 0);

      } catch (err) {
        console.error(err);
        mainContent.innerHTML = `<div class="error">Lỗi khi tải trang ảnh: ${err.message}</div>`;
      }
    }

    function escapeQuote(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
